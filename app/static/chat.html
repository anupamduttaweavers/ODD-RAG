<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordnance Document Intelligence</title>
    <link rel="stylesheet" href="/static/css/chat.css">
</head>

<body>
    <canvas id="particleCanvas"></canvas>

    <div class="chat-container">
        <div class="chat-header">
            <div class="header-org">Directorate of Ordnance</div>
            <h1>Document Intelligence System</h1>
            <p>Search &amp; query your document repository</p>
            <button id="newChatBtn" onclick="startNewChat()" title="Start a new conversation"
                style="position:absolute;top:12px;right:16px;z-index:2;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;backdrop-filter:blur(4px);transition:background .2s"
                onmouseenter="this.style.background='rgba(255,255,255,.28)'"
                onmouseleave="this.style.background='rgba(255,255,255,.15)'">+ New Chat</button>
        </div>

        <div class="messages-container" id="messagesContainer">
            <div class="empty-state">
                <div class="empty-state-icon">&#128269;</div>
                <div class="empty-state-text">Start a conversation</div>
                <div class="empty-state-subtext">Ask questions about your documents</div>
            </div>
        </div>

        <div class="input-container">
            <div class="input-group">
                <textarea id="messageInput" placeholder="Ask a question..." rows="1"></textarea>
                <button id="sendButton" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script src="/static/js/chat.js"></script>
</body>

</html>
