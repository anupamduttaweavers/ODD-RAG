<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordnance Document Intelligence</title>
    <link rel="stylesheet" href="/static/css/chat.css">
</head>

<body>
    <canvas id="particleCanvas"></canvas>

    <div class="chat-container">
        <div class="chat-header">
            <div class="header-org">Directorate of Ordnance</div>
            <h1>Document Intelligence System</h1>
            <p>Search &amp; query your document repository</p>
        </div>

        <div class="messages-container" id="messagesContainer">
            <div class="empty-state">
                <div class="empty-state-icon">&#128269;</div>
                <div class="empty-state-text">Start a conversation</div>
                <div class="empty-state-subtext">Ask questions about your documents</div>
            </div>
        </div>

        <div class="input-container">
            <div class="input-group">
                <textarea id="messageInput" placeholder="Ask a question..." rows="1"></textarea>
                <button id="sendButton" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script src="/static/js/chat.js"></script>
</body>

</html>
